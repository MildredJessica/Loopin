services:

  # ─────────────────────────────────────────────────────────────
  # Spring Boot Microservices
  # ─────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./server/user-service
      dockerfile: Dockerfile
    container_name: loopin-user-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=public
      - LOOPIN_JWT_SECRET=${LOOPIN_JWT_SECRET}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    networks:
      - loopin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  post-service:
    build:
      context: ./server/post-service
      dockerfile: Dockerfile
    container_name: loopin-post-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=posts
      - LOOPIN_JWT_SECRET=${LOOPIN_JWT_SECRET}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    networks:
      - loopin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./server/notification-service
      dockerfile: Dockerfile
    container_name: loopin-notification-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=public
    networks:
      - loopin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  message-service:
    build:
      context: ./server/message-service
      dockerfile: Dockerfile
    container_name: loopin-message-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=messaging
      - LOOPIN_JWT_SECRET=${LOOPIN_JWT_SECRET}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    networks:
      - loopin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: loopin-api-gateway
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - POST_SERVICE_URL=http://post-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - MESSAGE_SERVICE_URL=http://message-service:8084
      - LOOPIN_JWT_SECRET=${LOOPIN_JWT_SECRET}
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    networks:
      - loopin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # Next.js Client
  # ─────────────────────────────────────────────────────────────

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # These are baked in at build time (Next.js NEXT_PUBLIC_* vars)
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    container_name: loopin-client
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - loopin-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────
# Shared network
# ─────────────────────────────────────────────────────────────
networks:
  loopin-net:
    driver: bridge
