server:
  port: 8084

spring:
  application:
    name: message-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=messaging
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: messaging
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: messaging
    default-schema: messaging

loopin:
  jwt:
    secret: ${LOOPIN_JWT_SECRET}
  internal-api-key: ${LOOPIN_INTERNAL_API_KEY:${LOOPIN_JWT_SECRET}}
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  websocket:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    com.loopin.messageservice: DEBUG