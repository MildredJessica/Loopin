server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    # Supabase Postgres — see Project Settings → Database → Connection string.
    # Use the direct connection (port 5432), not the transaction pooler (6543).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER}
    password: ${DB_PASSWORD}   # set this as an env var, never commit it

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:notifications}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:notifications}
    default-schema: ${DB_SCHEMA:notifications}
    baseline-on-migrate: true

loopin:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  jwt:
    secret: ${LOOPIN_JWT_SECRET}
  internal-api-key: ${LOOPIN_INTERNAL_API_KEY:${LOOPIN_JWT_SECRET}}
