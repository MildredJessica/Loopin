<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loopin-ring-a" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
  </defs>

  <!-- Ring A: violet -> pink -->
  <rect x="20" y="20" width="140" height="140" rx="48" ry="48"
        fill="none" stroke="url(#loopin-ring-a)" stroke-width="24"
        transform="rotate(-16 90 90)"/>

  <!-- Ring B: mint -->
  <rect x="80" y="80" width="140" height="140" rx="48" ry="48"
        fill="none" stroke="#20D3A0" stroke-width="24"
        transform="rotate(16 150 150)"/>

  <!-- Spark accent where the loops meet -->
  <rect x="104" y="104" width="32" height="32" rx="11" ry="11"
        fill="#FFC93C" transform="rotate(-10 120 120)"/>
</svg>
